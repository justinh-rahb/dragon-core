name: host-tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Bambu parser tests
        run: tests/run_bambu_host_test.sh

      - name: Reject whitespace errors
        run: git diff --check
